<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI生成画像基本チェック</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">esora</p>
        <h1>AI生成画像基本チェック</h1>
      </div>
      <div class="session" id="session">確認中…</div>
    </header>

    <main>
      <section class="panel composer">
        <div class="drop" id="drop">
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden />
          <p class="drop-title">画像をドロップ</p>
          <p class="drop-copy">PNG / JPEG / WebP。文字切れ、誤字、余白、レイアウト、人体構造、AIっぽさを見ます。</p>
          <button type="button" class="button secondary" id="browse">ファイルを選ぶ</button>
        </div>

        <div class="drop reference-drop" id="reference-drop">
          <input id="reference-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          <div id="reference-empty">
            <p class="drop-title">参考画像（任意）</p>
            <p class="drop-copy">正解やカンプを置くと、色（色コード）、数（ボタン・紐など）、衣装（靴・ベルトなど）の違いも指摘します。</p>
            <button type="button" class="button secondary" id="reference-browse">参考画像を選ぶ</button>
          </div>
          <div class="queue-item reference-picked" id="reference-picked" hidden>
            <img id="reference-preview" alt="" />
            <div>
              <p class="name" id="reference-name"></p>
              <p class="meta" id="reference-meta"></p>
            </div>
            <button type="button" class="icon-button" id="reference-clear">外す</button>
          </div>
        </div>

        <fieldset class="field checks" id="focus-checks">
          <legend>見てほしい点（任意）</legend>
          <label class="check">
            <input type="checkbox" data-role="all" />
            <span>以下全部</span>
          </label>

          <label class="check">
            <input type="checkbox" data-role="group" data-group="body" />
            <span>人体の構造</span>
          </label>
          <div class="check-children" data-children="body">
            <label class="check">
              <input type="checkbox" data-role="item" data-group="body" data-label="指の本数（多い、少ない）" />
              <span>指の本数（多い、少ない）</span>
            </label>
            <label class="check">
              <input type="checkbox" data-role="item" data-group="body" data-label="肌の色" />
              <span>肌の色</span>
            </label>
            <label class="check">
              <input type="checkbox" data-role="item" data-group="body" data-label="髪の毛" />
              <span>髪の毛</span>
            </label>
            <label class="check">
              <input type="checkbox" data-role="item" data-group="body" data-label="髪の毛の生え方" />
              <span>髪の毛の生え方</span>
            </label>
          </div>

          <label class="check">
            <input type="checkbox" data-role="group" data-group="deco" />
            <span>装飾のチェック</span>
          </label>
          <div class="check-children" data-children="deco">
            <label class="check">
              <input type="checkbox" data-role="item" data-group="deco" data-label="服の色" />
              <span>服の色</span>
            </label>
            <label class="check">
              <input type="checkbox" data-role="item" data-group="deco" data-label="装飾のデザイン" />
              <span>装飾のデザイン</span>
            </label>
            <label class="check">
              <input type="checkbox" data-role="item" data-group="deco" data-label="パース" />
              <span>パース</span>
            </label>
          </div>
        </fieldset>

        <label class="field">
          <span>モデル</span>
          <select id="model"></select>
        </label>

        <div class="queue" id="queue" hidden></div>

        <div class="actions">
          <button type="button" class="button" id="check" disabled>チェックする</button>
          <button type="button" class="button ghost" id="clear" disabled>クリア</button>
        </div>
        <p class="hint">画像は esora のライブラリに <code>image-check</code> タグで残ります。</p>
      </section>

      <section class="panel results" id="results">
        <p class="empty">結果はここに出ます。</p>
      </section>
    </main>
    <script src="/redline.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
